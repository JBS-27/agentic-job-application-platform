<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkedIn Easy Apply</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true"></div>
        <div>
          <h1>Easy Apply</h1>
          <p class="subtitle">LinkedIn helper</p>
        </div>
      </header>

      <section class="status-card">
        <p id="status" class="status">Idle</p>
        <p id="counts" class="counts">Applied 0 · Skipped 0</p>
      </section>

      <div class="actions">
        <button id="start" type="button">Start</button>
        <button id="stop" type="button" disabled>Stop</button>
      </div>

      <p class="hint">
        One Start run stops at 100 applied + skipped, or if you leave LinkedIn.
        A new question waits 4 seconds; no typing skips that job.
        <button id="options" type="button" class="link">Options</button>
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
